<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>คลังบัญชี และ รายรับรายจ่าย</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500&family=Noto+Serif+Thai:wght@400;600&display=swap" rel="stylesheet">
<style>

:root{
  --bg:#ebe6da; --surface:#f4f0e6; --ink:#38362e; --muted:#7d7a6b; --line:#d3ccba;
  --moss:#5f6b4a; --moss-soft:#d9dcc6; --clay:#9a6f4f; --clay-soft:#e6d5c3; --danger:#8c4a3c;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#25241f; --surface:#2e2d26; --ink:#e6e1d3; --muted:#9b9784; --line:#464438;
    --moss:#a9b58a; --moss-soft:#3a4030; --clay:#cfa27f; --clay-soft:#43372c; --danger:#d08a7a;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#25241f; --surface:#2e2d26; --ink:#e6e1d3; --muted:#9b9784; --line:#464438;
  --moss:#a9b58a; --moss-soft:#3a4030; --clay:#cfa27f; --clay-soft:#43372c; --danger:#d08a7a;
  color-scheme:dark;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:"IBM Plex Sans Thai","Sarabun","Noto Sans Thai",system-ui,sans-serif;font-weight:400;line-height:1.6}
/* คลังบัญชี */
#vault{max-width:1120px;margin:0 auto;padding:56px 22px 80px;display:grid;grid-template-columns:minmax(0,2fr) minmax(0,3fr);column-gap:56px;align-content:start}
#vault h1,#vault .sub{grid-column:1/-1}
#vault form{grid-column:1;grid-row:3/span 4;align-self:start}
#vault .summary{grid-column:2;grid-row:3}
#vault h2{grid-column:2;grid-row:4}
#vault .tabs{grid-column:2;grid-row:5;display:flex;gap:6px;margin:8px 0 14px}
#vault #list{grid-column:2;grid-row:6}
#vault .tabs button{padding:5px 14px;border:1px solid var(--line);font-size:.88rem}
#vault .tabs button.on{background:var(--moss);color:var(--bg);border-color:var(--moss)}
#vault h1{font-family:"Noto Serif Thai",Georgia,serif;font-weight:600;font-size:2rem;margin:0 0 6px;letter-spacing:-.01em}
#vault .sub{color:var(--muted);margin:0 0 36px;font-weight:300}
#vault .sub a{color:var(--moss);font-weight:500}
#vault .summary{display:flex;flex-wrap:wrap;gap:28px;margin-bottom:32px;padding-bottom:20px;border-bottom:1px solid var(--line)}
#vault .summary div{display:flex;flex-direction:column}
#vault .summary b{font-family:"Noto Serif Thai",Georgia,serif;font-size:1.6rem;font-weight:400;line-height:1.2}
#vault .summary span{color:var(--muted);font-size:.85rem}
#vault form{display:grid;grid-template-columns:1fr;gap:14px;margin-bottom:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:24px}
#vault label{display:flex;flex-direction:column;gap:5px;font-size:.85rem;color:var(--muted)}
#vault label.wide{grid-column:1/-1}
#vault input{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);
  border-radius:6px;padding:11px 13px;outline:none;transition:border-color .15s}
#vault input:focus-visible{border-color:var(--moss);box-shadow:0 0 0 3px var(--moss-soft)}
#vault .pw{position:relative}
#vault .pw input{width:100%;padding-right:64px}
#vault .pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);padding:5px 9px}
#vault button{font:inherit;cursor:pointer;border:0;background:none;color:var(--muted);border-radius:5px}
#vault button:focus-visible{outline:2px solid var(--moss);outline-offset:2px}
#vault button.main{grid-column:1/-1;background:var(--moss);color:var(--bg);padding:12px;font-weight:500;border-radius:6px;transition:opacity .15s}
#vault button.main:hover{opacity:.9}
#vault h2{font-family:"Noto Serif Thai",Georgia,serif;font-weight:400;font-size:1.15rem;margin:0 0 4px}
#vault .item{padding:20px 0;border-top:1px solid var(--line)}
#vault .item:last-child{border-bottom:1px solid var(--line)}
#vault .row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
#vault .status{display:inline-flex;align-items:center;gap:8px;font-size:.9rem;font-weight:500}
#vault .dot{width:8px;height:8px;border-radius:50%;background:var(--clay)}
#vault .ready .dot{background:var(--moss)}
#vault .ready .status{color:var(--moss)}
#vault .wait .status{color:var(--clay)}
#vault .done .dot{background:var(--moss)}
#vault .done .status{color:var(--moss)}
#vault .done .bar i{background:var(--moss)}
#vault .done dl{opacity:.65}
#vault .acts{display:flex;gap:14px;align-items:center}
#vault .ok{color:var(--moss);border:1px solid var(--moss);padding:3px 12px}
#vault .ok:hover{background:var(--moss-soft)}
#vault .time{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.9rem}
#vault .bar{height:3px;background:var(--line);border-radius:2px;margin:12px 0 14px;overflow:hidden}
#vault .bar i{display:block;height:100%;background:var(--clay);transition:width .5s}
#vault .ready .bar i{background:var(--moss)}
#vault dl{display:grid;grid-template-columns:90px 1fr;gap:4px 12px;margin:0;font-size:.95rem}
#vault dt{color:var(--muted)}
#vault dd{margin:0;word-break:break-all;display:flex;gap:10px;align-items:center}
#vault .mini{font-size:.8rem;padding:2px 8px;border:1px solid var(--line);color:var(--muted)}
#vault .mini:hover{color:var(--ink);border-color:var(--muted)}
#vault .foot{display:flex;justify-content:space-between;margin-top:12px;font-size:.8rem;color:var(--muted)}
#vault .del:hover{color:var(--danger)}
#vault .empty{color:var(--muted);padding:28px 0;text-align:center;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
#vault .err{grid-column:1/-1;color:var(--danger);font-size:.85rem;min-height:1.2em;margin:-4px 0 0}
@media (max-width:820px){#vault{display:flex;flex-direction:column}
#vault form{margin-bottom:36px}
#vault .summary{order:1}
#vault h2,#vault .tabs,#vault #list{order:2}}
@media (max-width:520px){#vault form{grid-template-columns:1fr}
#vault .summary{gap:20px}
#vault dl{grid-template-columns:70px 1fr}}
@media (prefers-reduced-motion:reduce){#vault *{transition:none!important}}
/* รายรับรายจ่าย */
#ledger{max-width:1120px;margin:0 auto;padding:56px 22px 80px;display:grid;grid-template-columns:minmax(0,2fr) minmax(0,3fr);column-gap:56px;align-content:start}
#ledger h1,#ledger .sub{grid-column:1/-1}
#ledger h1{font-family:"Noto Serif Thai",Georgia,serif;font-weight:600;font-size:2rem;margin:0 0 6px;letter-spacing:-.01em}
#ledger .sub{color:var(--muted);margin:0 0 36px;font-weight:300}
#ledger .sub a{color:var(--moss);font-weight:500}
#ledger form{grid-column:1;grid-row:3/span 3;align-self:start;display:grid;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:24px}
#ledger .summary{grid-column:2;grid-row:3;display:flex;flex-wrap:wrap;gap:28px;margin-bottom:24px;padding-bottom:20px;border-bottom:1px solid var(--line)}
#ledger .summary div{display:flex;flex-direction:column}
#ledger .summary b{font-family:"Noto Serif Thai",Georgia,serif;font-size:1.6rem;font-weight:400;line-height:1.2;font-variant-numeric:tabular-nums}
#ledger .summary span{color:var(--muted);font-size:.85rem}
#ledger #inc{color:var(--moss)}
#ledger #exp{color:var(--clay)}
#ledger .tabs{grid-column:2;grid-row:4;display:flex;gap:6px;margin-bottom:8px;align-items:center;flex-wrap:wrap}
#ledger #L_list{grid-column:2;grid-row:5}
#ledger label{display:flex;flex-direction:column;gap:5px;font-size:.85rem;color:var(--muted)}
#ledger input,#ledger select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px 12px;outline:none}
#ledger input:focus-visible,#ledger select:focus-visible{border-color:var(--moss);box-shadow:0 0 0 3px var(--moss-soft)}
#ledger button{font:inherit;cursor:pointer;border:0;background:none;color:var(--muted);border-radius:5px}
#ledger button:focus-visible{outline:2px solid var(--moss);outline-offset:2px}
#ledger .seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:6px;overflow:hidden}
#ledger .seg button{padding:10px;border-radius:0}
#ledger .seg button.on{background:var(--moss);color:var(--bg);font-weight:500}
#ledger .seg button[data-t="out"].on{background:var(--clay)}
#ledger button.main{background:var(--moss);color:var(--bg);padding:12px;font-weight:500;border-radius:6px}
#ledger button.main:hover{opacity:.9}
#ledger .err{color:var(--danger);font-size:.85rem;min-height:1.2em;margin:-4px 0 0}
#ledger .tabs button{padding:5px 14px;border:1px solid var(--line);font-size:.88rem}
#ledger .tabs button.on{background:var(--moss);color:var(--bg);border-color:var(--moss)}
#ledger .tabs input{margin-left:auto;padding:5px 10px;font-size:.88rem}
#ledger .row{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:16px 0;border-top:1px solid var(--line)}
#ledger .row:last-child{border-bottom:1px solid var(--line)}
#ledger .info{min-width:0}
#ledger .cat{font-weight:500}
#ledger .meta{color:var(--muted);font-size:.85rem;word-break:break-word}
#ledger .amt{font-variant-numeric:tabular-nums;font-weight:500;white-space:nowrap;text-align:right}
#ledger .amt.in{color:var(--moss)}
#ledger .amt.out{color:var(--clay)}
#ledger .del{font-size:.8rem;display:block;margin-left:auto}
#ledger .del:hover{color:var(--danger)}
#ledger .empty{color:var(--muted);padding:28px 0;text-align:center;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
@media (max-width:820px){#ledger{display:flex;flex-direction:column}
#ledger form{margin-bottom:36px}
#ledger .summary{order:1}
#ledger .tabs,#ledger #L_list{order:2}}
/* เมนูสลับหน้า */
[hidden]{display:none!important}
.top{max-width:1120px;margin:0 auto;padding:28px 22px 0;display:flex;gap:8px}
.top button{font:inherit;font-weight:500;cursor:pointer;background:none;border:1px solid var(--line);color:var(--muted);padding:7px 20px;border-radius:999px;transition:color .15s,border-color .15s,background .15s}
.top button:hover:not(.on){color:var(--ink);border-color:var(--muted)}
.top button.on{background:var(--moss);border-color:var(--moss);color:var(--bg)}
.top button:focus-visible{outline:2px solid var(--moss);outline-offset:2px}
#vault,#ledger{padding-top:36px}
</style>
</head>
<body>
<nav class="top" role="tablist"><button data-v="vault" class="on" role="tab">คลังบัญชี</button><button data-v="ledger" role="tab">รายรับรายจ่าย</button></nav>
<main id="vault">
  <h1>คลังบัญชี</h1>
  <p class="sub">บันทึกข้อมูลแล้วรอครบ 7 วัน ระบบจะแจ้งว่าพร้อมใช้งาน</p>

  <div class="summary" aria-live="polite">
    <div><b id="nAll">0</b><span>ทั้งหมด</span></div>
    <div><b id="nWait">0</b><span>กำลังรอ</span></div>
    <div><b id="nReady">0</b><span>พร้อมใช้งาน</span></div>
    <div><b id="nDone">0</b><span>สำเร็จ</span></div>
  </div>

  <form id="f" autocomplete="off" novalidate>
    <label class="wide">อีเมล (ไม่บังคับ)
      <input id="email" type="email" placeholder="name@example.com">
    </label>
    <label>เบอร์โทรศัพท์
      <input id="phone" type="tel" inputmode="tel" placeholder="08x-xxx-xxxx" required>
    </label>
    <label>รหัสผ่าน
      <span class="pw">
        <input id="pass" type="password" required>
        <button type="button" id="tg">แสดง</button>
      </span>
    </label>
    <p class="err" id="err" role="alert"></p>
    <button class="main" type="submit">บันทึกและเริ่มนับ 7 วัน</button>
  </form>

  <h2>แดชบอร์ด</h2>
  <div class="tabs"><button data-f="all" class="on">ทั้งหมด</button><button data-f="open">ยังไม่เสร็จ</button><button data-f="done">เสร็จสิ้น</button></div>
  <div id="list"></div>
</main>
<main id="ledger" hidden>
  <h1>รายรับรายจ่าย</h1>
  <p class="sub">จดรายการเงินเข้าออก แล้วดูยอดคงเหลือแต่ละเดือน</p>

  <form id="L_f" autocomplete="off" novalidate>
    <div class="seg"><button type="button" data-t="in">รายรับ</button><button type="button" data-t="out" class="on">รายจ่าย</button></div>
    <label>จำนวนเงิน (บาท)<input id="amount" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0.00"></label>
    <label>หมวดหมู่<select id="cat"></select></label>
    <label>บันทึกเพิ่มเติม<input id="note" type="text" placeholder="ไม่บังคับ"></label>
    <label>อีเมล (ไม่บังคับ)<input id="L_email" type="email" placeholder="name@example.com"></label>
    <label>วันที่<input id="date" type="date"></label>
    <p class="err" id="L_err" role="alert"></p>
    <button class="main" type="submit">บันทึกรายการ</button>
  </form>

  <div class="summary" aria-live="polite">
    <div><b id="inc">0.00</b><span>รายรับ</span></div>
    <div><b id="exp">0.00</b><span>รายจ่าย</span></div>
    <div><b id="bal">0.00</b><span>คงเหลือ</span></div>
  </div>
  <div class="tabs">
    <button data-f="all" class="on">ทั้งหมด</button><button data-f="in">รายรับ</button><button data-f="out">รายจ่าย</button>
    <input type="month" id="month" aria-label="เลือกเดือน">
  </div>
  <div id="L_list"></div>
</main>
<script>
(function(){
  var KEY='vault-items-v1', WAIT=7*24*3600*1000;
  var items=[], shown={}, filter='all';
  function load(){try{var r=localStorage.getItem(KEY);items=r?JSON.parse(r):[];if(!Array.isArray(items))items=[]}catch(e){items=[]}}
  function save(){try{localStorage.setItem(KEY,JSON.stringify(items))}catch(e){}}
  var $=function(id){return document.getElementById(id)};
  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function pad(n){return String(n).padStart(2,'0')}
  function fmtLeft(ms){
    var s=Math.max(0,Math.floor(ms/1000)),d=Math.floor(s/86400);s%=86400;
    var h=Math.floor(s/3600);s%=3600;var m=Math.floor(s/60);s%=60;
    return 'เหลืออีก '+d+' วัน '+pad(h)+':'+pad(m)+':'+pad(s);
  }
  function fmtDate(t){return new Date(t).toLocaleString('th-TH',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'})}

  function render(){
    var el=$('list');
    var vis=items.filter(function(it){return filter==='all'||(filter==='done'?!!it.doneAt:!it.doneAt)});
    if(!vis.length){el.innerHTML='<p class="empty">ยังไม่มีรายการ</p>';update();return}
    el.innerHTML=vis.map(function(it){
      var pw=shown[it.id]?esc(it.pass):'••••••••';
      return '<article class="item" data-id="'+it.id+'">'+
        '<div class="row"><span class="status"><i class="dot"></i><span class="st"></span></span><span class="time"></span></div>'+
        '<div class="bar"><i></i></div>'+
        '<dl>'+
          (it.email?'<dt>อีเมล</dt><dd>'+esc(it.email)+'</dd>':'')+
          '<dt>เบอร์โทร</dt><dd>'+esc(it.phone)+'</dd>'+
          '<dt>รหัสผ่าน</dt><dd><span>'+pw+'</span>'+
            '<button class="mini" data-a="show">'+(shown[it.id]?'ซ่อน':'แสดง')+'</button>'+
            '<button class="mini" data-a="copy">คัดลอก</button></dd>'+
        '</dl>'+
        '<div class="foot"><span>บันทึกเมื่อ '+fmtDate(it.createdAt)+'</span><span class="acts"><button class="ok" data-a="done">'+(it.doneAt?'ยกเลิกสำเร็จ':'กดสำเร็จ')+'</button><button class="del" data-a="del">ลบ</button></span></div>'+
      '</article>';
    }).join('');
    update();
  }

  function update(){
    var now=Date.now(),w=0,r=0,d=0;
    items.forEach(function(it){
      var art=document.querySelector('#vault [data-id="'+it.id+'"]');
      var left=it.createdAt+WAIT-now,done=!!it.doneAt,ready=!done&&left<=0,wait=!done&&left>0;
      if(done)d++;else if(ready)r++;else w++;
      if(!art)return;
      art.classList.toggle('done',done);art.classList.toggle('ready',ready);art.classList.toggle('wait',wait);
      art.querySelector('.st').textContent=done?'สำเร็จ ✓':(ready?'พร้อมใช้งาน':'กำลังรอ');
      art.querySelector('.time').textContent=done?'สำเร็จเมื่อ '+fmtDate(it.doneAt):(ready?'ครบกำหนด '+fmtDate(it.createdAt+WAIT):fmtLeft(left));
      art.querySelector('.bar i').style.width=(done?100:Math.min(100,(now-it.createdAt)/WAIT*100))+'%';
    });
    $('nAll').textContent=items.length;$('nWait').textContent=w;$('nReady').textContent=r;$('nDone').textContent=d;
  }

  $('tg').addEventListener('click',function(){
    var p=$('pass'),h=p.type==='password';p.type=h?'text':'password';this.textContent=h?'ซ่อน':'แสดง';
  });

  $('f').addEventListener('submit',function(e){
    e.preventDefault();
    var email=$('email').value.trim(),phone=$('phone').value.trim(),pass=$('pass').value;
    var err='';
    if(email&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))err='กรุณากรอกอีเมลให้ถูกต้อง';
    else if(phone.replace(/\D/g,'').length<9)err='กรุณากรอกเบอร์โทรศัพท์ให้ครบ';
    else if(!pass)err='กรุณากรอกรหัสผ่าน';
    $('err').textContent=err;
    if(err)return;
    items.unshift({id:'i'+Date.now(),email:email,phone:phone,pass:pass,createdAt:Date.now()});
    save();this.reset();$('pass').type='password';$('tg').textContent='แสดง';render();
  });

  $('list').addEventListener('click',function(e){
    var b=e.target.closest('button[data-a]');if(!b)return;
    var id=b.closest('.item').dataset.id,it=items.filter(function(x){return x.id===id})[0];
    if(!it)return;
    var a=b.dataset.a;
    if(a==='show'){shown[id]=!shown[id];render()}
    else if(a==='done'){it.doneAt=it.doneAt?null:Date.now();save();render()}
    else if(a==='del'){if(confirm('ลบรายการนี้ใช่หรือไม่')){items=items.filter(function(x){return x.id!==id});save();render()}}
    else if(a==='copy'){
      var done=function(){b.textContent='คัดลอกแล้ว';setTimeout(function(){b.textContent='คัดลอก'},1200)};
      try{navigator.clipboard.writeText(it.pass).then(done,function(){})}catch(x){}
    }
  });

  document.querySelector('#vault .tabs').addEventListener('click',function(e){var b=e.target.closest('button[data-f]');if(!b)return;filter=b.dataset.f;this.querySelectorAll('button').forEach(function(x){x.classList.toggle('on',x===b)});render()});

  load();render();setInterval(update,1000);
})();
</script>
<script>
(function(){
  var KEY='ledger-v1',items=[],type='out',filter='all';
  var CATS={in:['เงินเดือน','รายได้เสริม','ของขวัญ','อื่นๆ'],out:['อาหาร','เดินทาง','ที่พัก','ช้อปปิ้ง','สุขภาพ','อื่นๆ']};
  var $=function(id){return document.getElementById(id)};
  function load(){try{var r=localStorage.getItem(KEY);items=r?JSON.parse(r):[];if(!Array.isArray(items))items=[]}catch(e){items=[]}}
  function save(){try{localStorage.setItem(KEY,JSON.stringify(items))}catch(e){}}
  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function fmt(n){return n.toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2})}
  function fmtDate(d){return new Date(d+'T00:00:00').toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'numeric'})}
  function today(){return new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10)}

  function fillCats(){$('cat').innerHTML=CATS[type].map(function(c){return '<option>'+c+'</option>'}).join('')}

  function render(){
    var m=$('month').value;
    var inM=items.filter(function(it){return !m||it.date.slice(0,7)===m});
    var inc=0,exp=0;
    inM.forEach(function(it){it.type==='in'?inc+=it.amount:exp+=it.amount});
    $('inc').textContent=fmt(inc);$('exp').textContent=fmt(exp);$('bal').textContent=fmt(inc-exp);
    var vis=inM.filter(function(it){return filter==='all'||it.type===filter})
      .sort(function(a,b){return b.date.localeCompare(a.date)||b.createdAt-a.createdAt});
    $('L_list').innerHTML=vis.length?vis.map(function(it){
      return '<div class="row" data-id="'+it.id+'"><div class="info"><div class="cat">'+esc(it.cat)+'</div>'+
        '<div class="meta">'+fmtDate(it.date)+(it.note?' – '+esc(it.note):'')+(it.email?' – '+esc(it.email):'')+'</div></div>'+
        '<div><div class="amt '+it.type+'">'+(it.type==='in'?'+':'−')+fmt(it.amount)+'</div><button class="del" data-a="del">ลบ</button></div></div>';
    }).join(''):'<p class="empty">ยังไม่มีรายการ</p>';
  }

  document.querySelector('#ledger .seg').addEventListener('click',function(e){
    var b=e.target.closest('button[data-t]');if(!b)return;
    type=b.dataset.t;this.querySelectorAll('button').forEach(function(x){x.classList.toggle('on',x===b)});fillCats();
  });
  document.querySelector('#ledger .tabs').addEventListener('click',function(e){
    var b=e.target.closest('button[data-f]');if(!b)return;
    filter=b.dataset.f;this.querySelectorAll('button').forEach(function(x){x.classList.toggle('on',x===b)});render();
  });
  $('month').addEventListener('input',render);

  $('L_f').addEventListener('submit',function(e){
    e.preventDefault();
    var amt=parseFloat($('amount').value),date=$('date').value,em=$('L_email').value.trim();
    var err=!(amt>0)?'กรุณากรอกจำนวนเงินมากกว่า 0':(!date?'กรุณาเลือกวันที่':(em&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)?'กรุณากรอกอีเมลให้ถูกต้อง':''));
    $('L_err').textContent=err;if(err)return;
    items.push({id:'t'+Date.now(),type:type,amount:amt,cat:$('cat').value,note:$('note').value.trim(),email:em,date:date,createdAt:Date.now()});
    save();$('amount').value='';$('note').value='';$('L_email').value='';render();
  });

  $('L_list').addEventListener('click',function(e){
    var b=e.target.closest('button[data-a="del"]');if(!b)return;
    var id=b.closest('.row').dataset.id;
    if(confirm('ลบรายการนี้ใช่หรือไม่')){items=items.filter(function(x){return x.id!==id});save();render()}
  });

  load();fillCats();$('date').value=today();render();
})();
</script>
<script>(function(){
  var tabs=document.querySelectorAll('.top button'),views={vault:document.getElementById('vault'),ledger:document.getElementById('ledger')};
  function show(n){if(!views[n])n='vault';for(var k in views)views[k].hidden=(k!==n);tabs.forEach(function(b){var on=b.dataset.v===n;b.classList.toggle('on',on);b.setAttribute('aria-selected',on)})}
  tabs.forEach(function(b){b.addEventListener('click',function(){show(b.dataset.v);try{history.replaceState(null,'','#'+b.dataset.v)}catch(e){}})});
  show(location.hash.slice(1));
})();</script>
</body>
</html>
